# Reviewed web-backend settings; repository root is required. Railway no longer accepts a
# config-as-code file selection, so these exact values are applied as the web service's
# settings. Scheduled services keep their own settings. Changes need deployment authorization.
[build]
builder = "RAILPACK"
buildCommand = "npm ci --include=dev && npm --prefix backend ci --include=dev && npm run build:backend-release"
watchPatterns = ["/backend/**", "/paid/**", "/components/**", "/lib/**", "/scripts/buildPaidReport.mjs", "/scripts/verifyBackendBuild.mjs", "/package.json", "/package-lock.json", "/tsconfig.json", "/railway.backend.toml"]

[deploy]
preDeployCommand = ["npm --prefix backend run db:migrate"]
startCommand = "npm --prefix backend start"
healthcheckPath = "/health"
healthcheckTimeout = 120
